[project]
name = "obsidian-secondbrain-mcp"
version = "0.1.0"
description = "Local-only MCP server for an Obsidian vault run as a Karpathy-style second brain. No external APIs, no API keys."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
obsidian-secondbrain = "obsidian_secondbrain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_secondbrain"]
